<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>图解教程</title>
<meta name="description" content="交互式图解教程：机制图解、可单步执行的模拟器、先预测再验证的练习和动手实验。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Cpath d='M9 22V10h6a4 4 0 010 8h-6M17 18l6 4' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* 配色与 OSTEP 图解（/ostep/assets/style.css）一致 */
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --surface-2: #f0eee8; --fg: #1d1d1f; --muted: #62625e; --faint: #9a9892;
    --border: #dedbd2; --accent: #2f5bd3; --accent-soft: #e6ecfb; --ok: #1f8a4c;
    /* 每个教程的主题色（卡片顶边、分类标签）：--t1 蓝 --t2 橙 --t3 绿 --t4 紫 */
    --t1: #2f5bd3; --t2: #c4531f; --t3: #1f8a4c; --t4: #8e44b5;
    --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", Consolas, "Noto Sans Mono CJK SC", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --surface: #1f2024; --surface-2: #28292e; --fg: #e8e6e1; --muted: #a3a19b; --faint: #6d6b66;
      --border: #34353b; --accent: #7aa2ff; --accent-soft: #232c45; --ok: #4cc27f;
      --t1: #7aa2ff; --t2: #ff8a5c; --t3: #4cc98d; --t4: #c98be8;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.7 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  main { max-width: 920px; margin: 0 auto; padding: 56px 20px 40px; }

  .hero h1 { font-size: clamp(32px, 7vw, 48px); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 12px; }
  .hero p { font-size: 18px; color: var(--muted); max-width: 36em; margin: 0; }

  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; margin: 40px 0 0; }
  .tut { position: relative; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--border);
         border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); border-top: 4px solid var(--tc, var(--accent)); }
  .tut:hover { border-color: var(--tc, var(--accent)); }
  .tut .kicker { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--tc, var(--accent)); }
  .tut h2 { font-size: 24px; line-height: 1.3; margin: 0; }
  /* 整张卡片可点：标题链接的伪元素铺满卡片，卡片里其他链接叠在它上面 */
  .tut h2 a { color: var(--fg); }
  .tut h2 a::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }
  .tut .en { font-size: 13.5px; color: var(--muted); margin-top: -6px; }
  .tut .desc { margin: 0; }
  .tut .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tut .tags li { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 10px; }
  .tut .progress { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); }
  .tut .progress[hidden] { display: none; }
  .tut .track { flex: 1; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .tut .fill { height: 100%; background: var(--ok); }
  .tut .progress b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .tut .foot { display: flex; align-items: center; gap: 16px; margin-top: auto; padding-top: 4px; font-size: 14px; }
  .tut .foot .go { font-weight: 600; color: var(--tc, var(--accent)); }
  .tut .foot .src { position: relative; z-index: 1; margin-left: auto; color: var(--muted); }

  footer { max-width: 920px; margin: 0 auto; padding: 24px 20px 40px; font-size: 13px; color: var(--muted); text-align: center; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header class="hero">
    <h1>图解教程</h1>
    <p>把难啃的经典教材拆成图解、可以单步执行的模拟器和动手实验，先预测、再验证，边玩边学。</p>
  </header>

  <!-- 新增教程：复制一个 .tut 块，改链接、文字和主题色（--tc: var(--t1..t4)）。
       data-progress="前缀:总数" 可选：教程在本站 localStorage 里用 "前缀+编号" = true 记录学完的单元，首页据此显示进度。 -->
  <section class="list" aria-label="全部教程">
    <article class="tut" style="--tc: var(--t1)" data-progress="ostep-done-:40">
      <div class="kicker">操作系统</div>
      <h2><a href="/ostep/">OSTEP 图解</a></h2>
      <div class="en">Operating Systems: Three Easy Pieces</div>
      <p class="desc">原书 40 个核心章节：虚拟化、并发、持久化。每章有机制图解、可改参数单步执行的模拟器、预测练习、C 实验和自测题。</p>
      <ul class="tags"><li>40 章</li><li>交互模拟器</li><li>C 实验</li><li>自测题</li></ul>
      <div class="progress" hidden><div class="track"><div class="fill"></div></div><span>已学完 <b></b> 章</span></div>
      <div class="foot"><span class="go">开始学习 →</span><a class="src" href="https://github.com/shakespark/ostep-illustrated" target="_blank" rel="noopener">GitHub ↗</a></div>
    </article>
  </section>
</main>

<footer>
  <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">京ICP备18057656号-1</a>
</footer>

<script>
  // 各教程与首页同源，直接读它们存在 localStorage 里的学习进度
  document.querySelectorAll(".tut[data-progress]").forEach((el) => {
    const [prefix, total] = el.dataset.progress.split(":");
    let done = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith(prefix) && JSON.parse(localStorage.getItem(k)) === true) done++;
      }
    } catch (e) { return; }
    if (!done) return;
    const p = el.querySelector(".progress");
    p.querySelector("b").textContent = `${done} / ${total}`;
    p.querySelector(".fill").style.width = `${Math.min(100, (done / total) * 100)}%`;
    p.hidden = false;
  });
</script>
</body>
</html>
